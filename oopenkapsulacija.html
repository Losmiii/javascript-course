<body>
  <script>
    class Person {

      constructor(name, age) {
        this.name = name;
        this.age = age;
        this.job = "";
      }

        getName = () => {
          return this.name;
        } ;


         getAge = () => {
          return this.age;
        } ;

        setJob = (job) => {
          this.job = job
        }
        } 

        class House {

          constructor(adress, price, residents){
            this.adress = adress;
            this.price = price;
            this.residents = residents;
          }

          getAddress = () => {
            return this.adress
          }

          getPrice = () => {
            return this.price
          }

          getResidents = () => {
            return this.residents
          };


          addResident = (resident) => {
            this.residents.push(resident);
            
          };
        }
        
        let pedro = new Person("pedro", 23);
        console.log(pedro.age);                                     

  </script>
