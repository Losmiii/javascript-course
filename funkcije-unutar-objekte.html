     const cart = {
      quantity: 0,

      addItem: function (amount){
        if(this.quantity  + amount > 10){

    const score = {
      wins: 0,
      losses: 0,
      ties: 0,


      updateScore: function (result){
        if (result === 'win'){
          this.wins += 1;
        } else if (result === 'loss'){
          this.losses += 1;
        } else if (result === 'tie'){
          this.ties += 1;
        }
      }
    }
    

    console.log(score);

    score.updateScore('win');
    console.log(score);
    score.updateScore('loss');
    console.log(score);
    score.updateScore('tie');
    console.log(score);

    console.log(`Wins: ${score.wins} , Losses: ${score.losses } Ties: ${score.ties}` );

    

    localStorage.setItem('ime', JSON.stringify(score));
    
    const loadedScore = JSON.parse(localStorage.getItem('ime'));

    console.log(loadedScore.wins);
