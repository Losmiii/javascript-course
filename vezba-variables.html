<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const name = 'Milos';
    console.log(`My name is ${name}.`);
    let coffee = 5;
    let bagel = 2 * 3;
    let soup = 9;

    const cost = coffee + bagel + soup;
    console.log(`Cost of food: $${cost}.`);
    const tax = cost * 0.1;
    console.log(`Tax (10%: $${cost + tax})`);
    const totalCost = cost + tax;
    console.log(`Total cost: $${totalCost}`);
  </script>
</body>
</html>
