<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <script>
    class Person {

      constructor(name, age) {
        this.name = name;
        this.age = age;
      }

        getName = () => {
          return this.name;
        } ;


         getAge = () => {
          return this.age;
        } ;
        } 

        class House {

          constructor(adress, price, residents){
            this.adress = adress;
            this.price = price;
            this.residents = residents;
          }

          getAddress = () => {
            return this.adress
          }

          getPrice = () => {
            return this.price
          }

          getResidents = () => {
            return this.residents
          };


          addResident = (resident) => {
            this.residents.push(resident);
            
          }
        }

        let Pedro = new Person("Pedro", 19);
        let David = new Person("Dadvid", 22);

        let house = new House("Nikola tesla", 280000, [Pedro, David])

        console.log(house.getResidents());

        let Paulo = new Person("Paulo", 19);
        house.addResident(Paulo);
        console.log(house.getResidents());

  </script>
</body>
